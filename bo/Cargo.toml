[package]
name = "bo"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = "0.12"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[profile.dev]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false